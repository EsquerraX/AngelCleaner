
plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
android {
    namespace 'com.angel.ao'; compileSdk 34
    defaultConfig { applicationId "com.angel.ao"; minSdk 24; targetSdk 34; versionCode 3; versionName "3.0-REAL-LIMPIEZA" }
    buildTypes { release{ minifyEnabled false }; debug{ minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { viewBinding true }
}
dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'com.google.android.gms:play-services-ads:22.5.0'
}
